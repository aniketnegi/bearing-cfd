[project]
name = "eccentric-conical-bearing"
version = "0.1.0"
requires-python = ">=3.10,<3.14"
dependencies = [
    "build123d==0.11.1",
    "gmsh==4.15.2",
    "matplotlib==3.10.7",
    "meshio==5.3.5",
    "ocp-vscode==4.0.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = ["integration: requires a real licensed external solver"]
